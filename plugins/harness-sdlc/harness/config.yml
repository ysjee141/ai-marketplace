# 하네스 설정
#
# 이 파일은 대상 저장소에 설치된 뒤 프로젝트에 맞게 수정한다.
# 상세 설명: harness/execution-modes.md

# ── 실행 모드 ────────────────────────────────────────────────
# skill    : 서브에이전트 없음. 메인 세션이 역할을 순차 전환. 토큰 최소
# balanced : 게이트 리뷰 + 통합 QA만 위임. 판정 독립성 확보 (권장 기본값)
# agent    : 분석·구현은 팀, 나머지는 서브에이전트. 병렬성 최대. 대규모 작업용
# ask      : 작업 시작 시마다 사용자에게 질문
execution_mode: balanced

# 규모가 크면 모드 상향을 제안한다 (자동 전환하지 않고 사용자에게 질문).
auto_suggest_mode: true

suggest_thresholds:
  upgrade_to_agent:          # 아래 중 하나라도 충족하면 agent 상향 제안
    tasks: 15
    roles: 3
    parallel_rounds: 3
  downgrade_to_skill:        # 아래를 모두 충족하면 skill 하향 제안
    tasks: 5
    roles: 1

# ── 품질 기준 ────────────────────────────────────────────────
# 모드와 무관하게 적용된다. 낮추려면 ADR로 근거를 남긴다.
coverage_thresholds:
  domain: 90
  application: 80
  adapter: 60
  total: 75

gate:
  max_retries: 3             # 초과 시 자동 재작업 중단, 사용자 보고
  blocker_rejects: 1         # BLOCKER n건 이상이면 REJECT
  major_rejects: 3           # MAJOR n건 이상이면 REJECT

# ── 아키텍처 검증 ────────────────────────────────────────────
# A1~A4는 필수. 나머지는 해당 요소가 존재할 때 추가한다.
architecture_rules: [A1, A2, A3, A4]

# ── 문서 ─────────────────────────────────────────────────────
docs:
  promote_requires_approval: true    # 문서 승격에 사용자 승인 필수
  workspace_retention: keep          # keep | archive — _workspace 보존 정책
